<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #ec4899
    );

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}

/* CONTAINER */
.container{

    width:100%;

    max-width:500px;

    text-align:center;
}

/* TITLE */
h2{

    color:white;

    margin-bottom:20px;

    font-size:35px;
}

/* FORM */
form{

    background:
    rgba(255,255,255,0.15);

    backdrop-filter:blur(12px);

    padding:35px;

    border-radius:20px;

    box-shadow:
    0px 8px 25px rgba(0,0,0,0.2);

    text-align:left;

    color:white;
}

/* LABEL */
label{

    font-weight:500;
}

/* INPUT */
input{

    width:100%;

    padding:12px;

    margin-top:8px;

    margin-bottom:18px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:0.3s;
}

/* INPUT FOCUS */
input:focus{

    transform:scale(1.02);

    box-shadow:
    0px 0px 10px #93c5fd;
}

/* RADIO + CHECKBOX */
input[type="radio"],
input[type="checkbox"]{

    width:auto;

    margin-right:5px;
}

/* BUTTON */
button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        to right,
        #06b6d4,
        #2563eb
    );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

/* BUTTON HOVER */
button:hover{

    transform:translateY(-3px);

    opacity:0.9;
}

/* OUTPUT */
#output{

    margin-top:25px;

    background:white;

    color:#222;

    padding:20px;

    border-radius:15px;

    line-height:1.8;

    box-shadow:
    0px 5px 15px rgba(0,0,0,0.1);
}

/* MOBILE */
@media(max-width:600px){

    form{

        padding:25px;
    }

    h2{

        font-size:28px;
    }

}

</style>
