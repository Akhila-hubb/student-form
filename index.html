<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* RESET */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* BODY */
        body{

            font-family:'Poppins',sans-serif;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed,
                #ec4899
            );

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

            padding:20px;
        }

        /* CONTAINER */
        .container{

            width:100%;

            max-width:500px;

            text-align:center;
        }

        /* TITLE */
        h2{

            color:white;

            margin-bottom:20px;

            font-size:35px;
        }

        /* FORM */
        .form-container{

            background:
            rgba(255,255,255,0.15);

            backdrop-filter:blur(12px);

            padding:35px;

            border-radius:20px;

            box-shadow:
            0px 8px 25px rgba(0,0,0,0.2);

            text-align:left;

            color:white;
        }

        /* LABEL */
        label{

            font-weight:500;
        }

        /* INPUT */
        input{

            width:100%;

            padding:12px;

            margin-top:8px;

            margin-bottom:18px;

            border:none;

            border-radius:10px;

            outline:none;

            font-size:15px;

            transition:0.3s;
        }

        /* INPUT FOCUS */
        input:focus{

            transform:scale(1.02);

            box-shadow:
            0px 0px 10px #93c5fd;
        }

        /* RADIO + CHECKBOX */
        input[type="radio"],
        input[type="checkbox"]{

            width:auto;

            margin-right:5px;
        }

        /* BUTTON */
        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:
            linear-gradient(
                to right,
                #06b6d4,
                #2563eb
            );

            color:white;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        /* BUTTON HOVER */
        button:hover{

            transform:translateY(-3px);

            opacity:0.9;
        }

        /* OUTPUT */
        #output{

            margin-top:25px;

            background:white;

            color:#222;

            padding:20px;

            border-radius:15px;

            line-height:1.8;

            box-shadow:
            0px 5px 15px rgba(0,0,0,0.1);
        }

        /* MOBILE */
        @media(max-width:600px){

            .form-container{

                padding:25px;
            }

            h2{

                font-size:28px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <!-- FORM -->
    <form id="myForm"
          class="form-container">

        <!-- NAME -->
        <label>Name</label>

        <input type="text"
               name="name"
               placeholder="Enter your name">

        <!-- AGE -->
        <label>Age</label>

        <input type="number"
               name="age"
               placeholder="Enter your age">

        <!-- EMAIL -->
        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter your email">

        <!-- PASSWORD -->
        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password">

        <!-- PHONE -->
        <label>Phone</label>

        <input type="tel"
               name="phone"
               placeholder="Enter phone number">

        <!-- GENDER -->
        <label>Gender</label><br><br>

        <input type="radio"
               name="gender"
               value="Male">

        Male

        <input type="radio"
               name="gender"
               value="Female">

        Female

        <br><br>

        <!-- SKILLS -->
        <label>Skills</label><br><br>

        <input type="checkbox"
               name="skills"
               value="HTML">

        HTML

        <input type="checkbox"
               name="skills"
               value="CSS">

        CSS

        <input type="checkbox"
               name="skills"
               value="JS">

        JavaScript

        <br><br>

        <!-- DOB -->
        <label>Date of Birth</label>

        <input type="date"
               name="dob">

        <!-- BUTTON -->
        <button type="submit">

            Submit

        </button>

    </form>

    <!-- OUTPUT -->
    <div id="output"></div>

</div>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

    let form =
        document.getElementById("myForm");

    form.addEventListener(
        "submit",
        function(event){

        /* STOP RELOAD */
        event.preventDefault();

        /* GET VALUES */
        let name =
            document.getElementsByName("name")[0].value;

        let age =
            document.getElementsByName("age")[0].value;

        let email =
            document.getElementsByName("email")[0].value;

        let password =
            document.getElementsByName("password")[0].value;

        let phone =
            document.getElementsByName("phone")[0].value;

        let dob =
            document.getElementsByName("dob")[0].value;

        /* VALIDATION */
        if(
            name === "" ||
            age === "" ||
            email === "" ||
            password === "" ||
            phone === "" ||
            dob === ""
        ){

            alert("Please fill all fields");

            return;
        }

        /* PASSWORD CHECK */
        if(password.length < 6){

            alert(
                "Password must be at least 6 characters"
            );

            return;
        }

        /* GET GENDER */
        let gender = "";

        let genders =
            document.getElementsByName("gender");

        for(
            let i = 0;
            i < genders.length;
            i++
        ){

            if(genders[i].checked){

                gender =
                    genders[i].value;
            }

        }

        /* GET SKILLS */
        let skills = "";

        let skillList =
            document.getElementsByName("skills");

        for(
            let i = 0;
            i < skillList.length;
            i++
        ){

            if(skillList[i].checked){

                skills +=
                    skillList[i].value + " ";
            }

        }

        /* OUTPUT */
        document.getElementById("output")
            .innerHTML =

            "<h3>Registration Details</h3>" +

            "Name: " + name + "<br>" +

            "Age: " + age + "<br>" +

            "Email: " + email + "<br>" +

            "Phone: " + phone + "<br>" +

            "Gender: " + gender + "<br>" +

            "Skills: " + skills + "<br>" +

            "DOB: " + dob;

        /* RESET FORM */
        form.reset();

    });

});

</script>

</body>
</html>
